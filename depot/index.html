<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#F4F0E6">
<title>Legacy Shaper · Collection Office</title>
<link rel="icon" href="../icon-192.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Hanken+Grotesk:wght@300;400;500;600&display=swap">
<style>
:root{--deep:#1B3924;--green:#244A30;--ink:#16241A;--gold:#C4A052;--goldtxt:#7A6332;--soft:#E9DDBE;--ivory:#F4F0E6;--paper:#FBF8F1;--line:rgba(36,74,48,.16);--muted:#5d6b60}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ivory);color:var(--ink);font:400 16px/1.55 "Hanken Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.wrap{max-width:760px;margin:0 auto;padding:calc(28px + env(safe-area-inset-top,0px)) 16px calc(40px + env(safe-area-inset-bottom,0px))}
.top{display:flex;justify-content:flex-end;min-height:28px}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{all:unset;cursor:pointer;padding:5px 12px;font:500 11px/1 "Hanken Grotesk",sans-serif;letter-spacing:2px;color:var(--muted)}
.lang button.on{background:var(--green);color:var(--ivory)}
.hero{text-align:center;padding:6px 0 22px}
.logo{display:block;margin:0 auto 22px;width:150px;height:auto}
.kick{font:500 11px/1 "Hanken Grotesk",sans-serif;letter-spacing:4px;text-transform:uppercase;color:var(--goldtxt)}
h1{font:500 clamp(34px,7vw,46px)/1.08 "Cormorant Garamond",Georgia,serif;color:var(--green);margin:12px 0 18px}
.rule{width:56px;height:1px;background:var(--gold);margin:0 auto 18px}
.lead{font:400 clamp(19px,3.6vw,21px)/1.5 "Cormorant Garamond",Georgia,serif;color:var(--ink);max-width:600px;margin:0 auto 12px}
.how{font-size:14px;color:var(--muted);max-width:560px;margin:0 auto}
.preview{border:1px dashed var(--gold);border-radius:10px;padding:8px 12px;font-size:14px;color:var(--goldtxt);text-align:center;margin:0 0 14px}
.progress{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 6px}
.progress div{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}
.progress b{display:block;font:500 22px/1.1 "Cormorant Garamond",Georgia,serif;color:var(--green)}
.progress span{font:500 10px/1.3 "Hanken Grotesk",sans-serif;letter-spacing:1.5px;text-transform:uppercase;color:var(--goldtxt)}
@media (max-width:480px){.progress{grid-template-columns:repeat(2,1fr)}}
section{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:22px 18px 12px;margin:18px 0}
h2{font:500 26px/1.15 "Cormorant Garamond",Georgia,serif;color:var(--green);margin:0 0 4px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
h2 .cnt{font:500 12px/1 "Hanken Grotesk",sans-serif;letter-spacing:1px;color:var(--goldtxt);white-space:nowrap}
.sub{font-size:14px;color:var(--muted);margin:2px 0 10px}
.drop{display:block;border:1.5px dashed rgba(36,74,48,.4);border-radius:14px;background:#fff;padding:26px 16px;text-align:center;cursor:pointer;transition:background .15s,border-color .15s}
.drop.over{background:var(--soft);border-color:var(--green)}
.drop b{display:block;font:500 21px/1.3 "Cormorant Garamond",Georgia,serif;color:var(--green);margin-bottom:6px}
.drop span{font-size:14px;color:var(--muted)}
.acts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:14px 0 6px}
.btn{appearance:none;-webkit-appearance:none;cursor:pointer;border:0;border-radius:999px;background:var(--deep);color:var(--ivory);padding:14px 24px;font:500 12px/1 "Hanken Grotesk",sans-serif;letter-spacing:2.5px;text-transform:uppercase;min-height:46px}
.btn.ghost{background:transparent;color:var(--green);border:1px solid var(--green)}
.btn:disabled{opacity:.55;cursor:default}
.files{list-style:none;margin:12px 0 0;padding:0}
.files li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.files li span:first-child{overflow-wrap:anywhere;min-width:0}
.files li span:last-child{color:var(--muted);white-space:nowrap}
.item{padding:14px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.ql{margin:0 0 9px}
.ql small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{appearance:none;-webkit-appearance:none;cursor:pointer;border:1px solid rgba(36,74,48,.28);background:#fff;color:var(--ink);border-radius:999px;padding:8px 13px;font:400 14px/1.2 "Hanken Grotesk",sans-serif;min-height:38px}
.pill[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--ivory)}
.pill:focus-visible,.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.got{font-size:13px;color:var(--green);margin-top:8px}
select.t,input.t{width:100%;border:1px solid rgba(36,74,48,.28);background:#fff;border-radius:10px;padding:11px 12px;font:400 16px/1.2 "Hanken Grotesk",sans-serif;color:var(--ink)}
select.t{margin-top:8px}
.card{border:1px solid var(--line);border-radius:12px;background:#fff;padding:14px;margin:10px 0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.row2{grid-template-columns:1fr}}
label.f{display:block;font-size:13px;color:var(--muted);margin:8px 0 5px}
.chk{display:flex;gap:10px;align-items:flex-start;margin-top:10px;font-size:14px}
.chk input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--green)}
.rm{all:unset;cursor:pointer;color:var(--goldtxt);font-size:13px;margin-top:10px;display:inline-block}
.letter{border:1px solid var(--line);border-radius:12px;background:#fff;padding:16px;margin:10px 0;font:400 17px/1.5 "Cormorant Garamond",Georgia,serif}
.letter .to{font:500 11px/1 "Hanken Grotesk",sans-serif;letter-spacing:2px;text-transform:uppercase;color:var(--goldtxt);margin-bottom:8px}
.letter .draft{font:400 13px/1.4 "Hanken Grotesk",sans-serif;color:var(--goldtxt);margin-top:8px}
canvas.sig{display:block;width:100%;height:150px;border:1px solid rgba(36,74,48,.28);border-radius:10px;background:#fff;touch-action:none}
.signed{color:var(--green);font-size:14px;margin-top:8px}
.done{text-align:center;padding:24px 4px 6px}
.done p{font:400 21px/1.5 "Cormorant Garamond",Georgia,serif;max-width:540px;margin:0 auto 12px}
.note{font-size:14px;color:var(--muted);text-align:center;margin:10px auto 0;max-width:560px}
.foot{text-align:center;font:500 10px/1.6 "Hanken Grotesk",sans-serif;letter-spacing:3px;text-transform:uppercase;color:var(--goldtxt);margin-top:30px}
.exergue{background:var(--deep);color:var(--ivory);border-radius:14px;padding:20px 18px;margin:0 0 18px;border-left:4px solid var(--gold)}
.exergue b{display:block;font:500 23px/1.25 "Cormorant Garamond",Georgia,serif;color:var(--soft);margin-bottom:8px}
.exergue p{margin:0;font-size:15px;line-height:1.6}
ol.ess{margin:8px 0 6px;padding-left:22px}
ol.ess li{margin:0 0 10px;font-size:15px}
h2.two{text-align:center;display:block;margin:30px 0 4px}
.total{text-align:center;color:var(--green);font-size:14px;margin:0}
section.choice{border-width:1.5px;border-color:rgba(196,160,82,.55)}
.doubt{background:var(--soft);border-radius:10px;padding:12px 14px;font-size:14px;margin:6px 0 4px}
.cath{display:flex;justify-content:space-between;align-items:center;gap:12px}
.btn.sm{padding:10px 16px;min-height:40px;font-size:11px;letter-spacing:2px;flex:0 0 auto}
.formats{font-size:14px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:12px 0 0}
.phases .ph{border-left:3px solid var(--line);padding:4px 0 4px 14px;margin:12px 0}
.phases .ph.on{border-left-color:var(--gold)}
.phases .ph b{display:block;font:500 12px/1.3 "Hanken Grotesk",sans-serif;letter-spacing:2px;text-transform:uppercase;color:var(--goldtxt);margin-bottom:4px}
.phases .ph p{margin:0;font-size:15px}
.phend{font:italic 400 19px/1.4 "Cormorant Garamond",Georgia,serif;color:var(--green);margin:14px 0 4px}
textarea.t{width:100%;border:1px solid rgba(36,74,48,.28);background:#fff;border-radius:10px;padding:11px 12px;font:400 16px/1.4 "Hanken Grotesk",sans-serif;color:var(--ink);resize:vertical}
.qsent{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0}
.qsent p{margin:0 0 4px;font-size:15px}.qsent span{font-size:13px;color:var(--green)}
.link{border-top:1px solid var(--line);margin-top:18px;padding-top:16px}
.link b{display:block;font:500 20px/1.3 "Cormorant Garamond",Georgia,serif;color:var(--green);margin-bottom:4px}
.link p{font-size:14px;color:var(--muted);margin:0 0 10px}
.link small{color:var(--muted);overflow-wrap:anywhere}
.twop{text-align:center;max-width:560px;margin:6px auto 12px;font-size:15px}
.hidden{display:none!important}
</style>
</head>

    ["Ownership, loans and agreements", "Companies, trusts, co-ownership, loan, deposit or consignment agreements."],
    ["Other documents", "Anything relating to your works that has no other place: correspondence, notes, past costs."]],
  qT: "A question?", qP: "Write to us here: your message reaches us at once, and our reply is sent to you by email.",
  qPh: "Your question", qSend: "Send", qDone: "Your message has reached us. We will reply very shortly.",
  linkT: "Many documents? A simple link is enough.", linkP: "If you or your assistant would rather send everything in one go, through WeTransfer, Dropbox, Google Drive or any other service, simply paste the link here. You may also send it to office@legacy-shaper.com.",
  linkPh: "Paste your link here", linkSend: "Send the link", linkDone: "Link received: we are collecting your documents today.", linkBad: "This link seems incomplete: please copy it in full, it starts with https://",
  mailT: "By email, if you prefer", mailP: "You are also welcome to send your documents, or a transfer link, to office@legacy-shaper.com: they will join this same file.",
  helpT: "Does someone close to you hold documents?",
  helpP: "If your assistant, your lawyer, your family office or anyone else of your choosing holds some of these documents, please let us know whom to contact: we will open an access in their name. This access will only allow them to upload documents; viewing your collection and our analyses remains strictly reserved to you, unless you expressly request otherwise.",
  hName: "Name", hEmail: "Email", hRole: "Their role (assistant, lawyer, family office…)", hAdd: "Open an access", hDone: n => `Access request received for ${n}: we are sending them their link.`,
  endP: "Once you feel you have sent us the essentials, a simple click on “I have finished uploading” will allow us to begin the analysis. The link remains open afterwards: any document you find later will be most welcome.",
  finish: "I have finished uploading",
  doneP1: "Thank you. We are beginning the analysis of your documents.", doneP2: "At the end of phase 1, you will receive our first analysis. This link remains open: any document found later will be most welcome.",
  previewFinish: "Preview: the client will see the thank-you message here, and you will be notified in The Legacy.",
}};
const CAT_KEYS = ["list", "storage", "invoices", "photos", "certificates", "insurance", "condition", "valuations", "provenance", "shipping", "ownership", "other"];
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let lang = Q.get("lang") === "en" ? "en" : "fr";
let S = { files: [], helpers: [], questions: [], links: [], finished: false };
let target = null;   // the section a file is uploaded into (null = « Tout en vrac »)

function filesOf(k) { return S.files.filter(f => f.cat === k); }
function listHTML(fs) { const t = T[lang]; return fs.length ? `<ul class="files">${fs.slice().reverse().map(f => `<li><span>${esc(f.name)}</span><span>${esc(t.now)}</span></li>`).join("")}</ul>` : ""; }
function catHTML(k, i) {
  const t = T[lang], [label, help] = t.cats[i], n = filesOf(k).length;
  return `<div class="item" id="cat_${k}"><div class="cath"><div><p class="ql">${esc(label)}<small>${esc(help)}</small></p>${n ? `<p class="got">✓ ${esc(t.received(n))}</p>` : ""}</div>
    <button type="button" class="btn ghost sm" data-cat="${k}">${esc(t.share)}</button></div></div>`;
}
function render() {
  const t = T[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el => { const v = t[el.dataset.t]; if (typeof v === "string") el.textContent = v; });
  document.querySelectorAll(".lang button").forEach(b => b.classList.toggle("on", b.dataset.lang === lang));
  if (S.finished) { $("#main").innerHTML = `<section class="done"><p>${esc(t.doneP1)}</p><p>${esc(t.doneP2)}</p>${PREVIEW ? `<p class="note">${esc(t.previewFinish)}</p>` : ""}</section>`; return; }
  const bulk = filesOf(null);
  $("#main").innerHTML = `
  <section class="phases"><h2>${esc(t.phT)}</h2>
    <div class="ph on"><b>${esc(t.ph1T)}</b><p>${esc(t.ph1P)}</p></div>
    <div class="ph"><b>${esc(t.ph2T)}</b><p>${esc(t.ph2P)}</p></div>
    <p class="phend">${esc(t.phEnd)}</p></section>
  <div class="exergue"><b>${esc(t.exT)}</b><p>${esc(t.exP)}</p></div>
  <section><h2>${esc(t.essT)}</h2><ol class="ess">${t.ess.map(x => `<li>${esc(x)}</li>`).join("")}</ol></section>
  <h2 class="two">${esc(t.twoT)}</h2>
  <p class="twop">${esc(t.twoP)}</p>
  ${S.files.length ? `<p class="total">${esc(t.total(S.files.length))}</p>` : ""}
  <section class="choice"><h2>${esc(t.c1T)}<span class="cnt">${bulk.length ? esc(t.received(bulk.length)) : ""}</span></h2><p class="sub">${esc(t.c1S)}</p>
    <label class="drop" id="drop" tabindex="0"><b>${esc(t.dropB)}</b><span>${esc(t.dropS)}</span></label>
    <p class="formats">${esc(t.formats)}</p>
    <div class="link"><b>${esc(t.linkT)}</b><p>${esc(t.linkP)}</p>
      ${S.links.map(l => `<p class="signed">✓ ${esc(t.linkDone)}<br><small>${esc(l)}</small></p>`).join("")}
      <input class="t" id="lnk" type="url" inputmode="url" autocomplete="off" placeholder="${esc(t.linkPh)}"><p class="sub hidden" id="lnkBad">${esc(t.linkBad)}</p>
      <div class="acts"><button type="button" class="btn ghost" id="lnkSend">${esc(t.linkSend)}</button></div></div>
    <div class="acts"><button type="button" class="btn ghost" id="camBtn">${esc(t.photo)}</button><button type="button" class="btn ghost" id="pickBtn">${esc(t.files)}</button></div>
    ${listHTML(bulk)}</section>
  <section class="choice"><h2>${esc(t.c2T)}</h2><p class="sub">${esc(t.c2S)}</p>
    <div class="doubt">${esc(t.doubt)}</div>
    <p class="formats" style="margin-top:10px">${esc(t.formats)}</p>
    ${CAT_KEYS.map(catHTML).join("")}</section>
  <section id="ask"><h2>${esc(t.qT)}</h2><p class="sub">${esc(t.qP)}</p>
    ${S.questions.map(q => `<div class="qsent"><p>${esc(q)}</p><span>✓ ${esc(t.qDone)}</span></div>`).join("")}
    <textarea class="t" id="qText" rows="3" placeholder="${esc(t.qPh)}"></textarea>
    <div class="acts"><button type="button" class="btn ghost" id="qSend">${esc(t.qSend)}</button></div></section>
  <section><h2>${esc(t.mailT)}</h2><p class="sub">${esc(t.mailP)}</p></section>
  <section><h2>${esc(t.helpT)}</h2><p class="sub">${esc(t.helpP)}</p>
    ${S.helpers.map(h => `<p class="signed">✓ ${esc(t.hDone(h.name))}</p>`).join("")}
    <div class="row2"><div><label class="f" for="hName">${esc(t.hName)}</label><input class="t" id="hName" autocomplete="off"></div><div><label class="f" for="hEmail">${esc(t.hEmail)}</label><input class="t" id="hEmail" type="email" inputmode="email" autocomplete="off"></div></div>
    <label class="f" for="hRole">${esc(t.hRole)}</label><input class="t" id="hRole" autocomplete="off">
    <div class="acts"><button type="button" class="btn ghost" id="hAdd">${esc(t.hAdd)}</button></div></section>
  <p class="lead" style="text-align:center;font-size:19px;margin:26px auto 0">${esc(t.endP)}</p>
  <div class="acts" style="margin-top:18px"><button type="button" class="btn" id="finish">${esc(t.finish)}</button></div>`;
}
function addFiles(list) {
  for (const f of list) S.files.push({ name: f.name || "photo.jpg", size: f.size || 0, cat: target });
  // preview: nothing leaves the device. Connected version: signed upload URL per file, resumable, rubric kept with the file.
  target = null; render();
}
function wire() {
  document.querySelectorAll(".lang button").forEach(b => b.onclick = () => { lang = b.dataset.lang; render(); });
  $("#pick").onchange = e => { addFiles(e.target.files); e.target.value = ""; };
  $("#cam").onchange = e => { addFiles(e.target.files); e.target.value = ""; };
  const m = $("#main");
  m.addEventListener("click", e => {
    const c = e.target.closest("[data-cat]"); if (c) { target = c.dataset.cat; $("#pick").click(); return; }
    if (e.target.closest("#drop") || e.target.closest("#pickBtn")) { e.preventDefault(); target = null; $("#pick").click(); return; }
    if (e.target.closest("#camBtn")) { target = null; $("#cam").click(); return; }
    if (e.target.closest("#hAdd")) { const n = $("#hName").value.trim(), em = $("#hEmail").value.trim();
      if (!n || !/.+@.+\..+/.test(em)) { (n ? $("#hEmail") : $("#hName")).focus(); return; }
      S.helpers.push({ name: n, email: em, role: $("#hRole").value.trim() }); render(); return; }
    if (e.target.closest("#lnkSend")) { const v = $("#lnk").value.trim();
      if (!/^https:\/\/\S+\.\S+/.test(v)) { $("#lnkBad").classList.remove("hidden"); $("#lnk").focus(); return; }
      // connected version: kept with the file, Legacy Shaper notified at once (transfer links expire, often after 7 days)
      S.links.push(v); render(); return; }
    if (e.target.closest("#qSend")) { const q = $("#qText").value.trim(); if (!q) { $("#qText").focus(); return; }
      // connected version: stored with the contact's file, email + notification to Legacy Shaper; the reply goes out by email
      S.questions.push(q); render(); $("#ask").scrollIntoView({ block: "center" }); return; }
    if (e.target.closest("#finish")) { S.finished = true; render(); window.scrollTo({ top: 0, behavior: "smooth" }); }
  });
  m.addEventListener("dragover", e => { const d = e.target.closest("#drop"); if (d) { e.preventDefault(); d.classList.add("over"); } });
  m.addEventListener("dragleave", e => { const d = e.target.closest("#drop"); if (d) d.classList.remove("over"); });
  m.addEventListener("drop", e => { const d = e.target.closest("#drop"); if (!d) return; e.preventDefault(); target = null; addFiles(e.dataTransfer.files); });
}
function start() {
  wire(); $("#loading").classList.add("hidden");
  if (!PREVIEW) { $("#closed").classList.remove("hidden"); render(); return; }   // connected version comes next: until then only the preview opens
  $("#previewNote").classList.remove("hidden"); $("#main").classList.remove("hidden"); render();
}
start();
</script>
</body></html>
