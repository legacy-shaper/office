<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#1B3924">
<title>Collection Office</title>
<link rel="icon" href="../icon-192.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Hanken+Grotesk:wght@300;400;500;600&display=swap">
<style>
/* Devis en ligne (office.legacy-shaper.com/devis/?k=…, SQL 015, 12 Oct 2026). One ivory sheet, green band with the gold logo,
   continuous reading, then the signature. Everything shown comes from the frozen quote (quotes.doc): this page writes no
   commercial text of its own. Light paper look on purpose (a document), on every device. */
:root{
  --deep:#1B3924; --green:#244A30; --ink:#16241A; --gold:#C4A052; --gold-text:#7A6332;
  --soft:#E9DDBE; --ivory:#F4F0E6; --paper:#FBF9F3; --line:#D9CFB8; --muted:#5E6B60;
  --display:"Cormorant Garamond",Garamond,"Times New Roman",serif;
  --body:"Hanken Grotesk","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--ivory);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ivory);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(48px + env(safe-area-inset-bottom,0px));-webkit-font-smoothing:antialiased}
.note{max-width:820px;margin:0 auto 10px;padding:10px 14px;font-size:13px;color:var(--gold-text);text-align:center;border:1px dashed var(--gold);background:var(--paper)}
.sheet{max-width:820px;margin:0 auto;background:var(--paper);border:1px solid var(--line)}
.band{background:var(--deep);padding:28px 24px 22px;display:flex;flex-direction:column;align-items:center;gap:10px}
.band img{width:190px;max-width:60%;height:auto}
.band .co{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--gold)}
.in{padding:36px clamp(20px,6vw,64px) 44px}
.label{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold-text);font-weight:500}
h1{font-family:var(--display);font-weight:500;font-size:clamp(30px,5vw,42px);line-height:1.1;margin:.3em 0 .2em;color:var(--green);text-wrap:balance}
h2{font-family:var(--display);font-weight:500;font-size:26px;line-height:1.2;color:var(--green);margin:4px 0 12px;text-wrap:balance}
p{margin:0 0 12px;max-width:66ch}
.sub{color:var(--muted)}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px 24px;margin:26px 0 30px;padding:18px 0;border-block:1px solid var(--line)}
.meta div{min-width:0}
.meta b{display:block;font-weight:500;font-size:15px;overflow-wrap:anywhere}
.meta span{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
section{padding-block:26px;border-top:1px solid var(--line)}
section:first-of-type{border-top:0;padding-top:0}
.statement{font-family:var(--display);font-size:22px;line-height:1.35;color:var(--green);margin:4px 0 16px}
.small{font-size:13px;color:var(--muted)}
.box{padding:16px 18px;border-left:1px solid var(--gold);background:var(--ivory)}
.box b{font-weight:600}
.testbox{margin:22px 0 0}.testbox .label{color:var(--green)}
.figures{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin:18px 0 8px}
.fig{background:var(--paper);padding:16px 18px;min-width:0}
.fig .n{font-family:var(--display);font-size:30px;font-weight:500;color:var(--green);font-variant-numeric:tabular-nums;line-height:1.15}
.fig.main{background:var(--green)}
.fig.main .n{color:var(--gold)} .fig.main .label{color:var(--soft)}
.fig small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.fig.main small{color:#DDD5C3}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums;margin:14px 0}
th{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:500;text-align:left;padding:8px 6px;border-bottom:1px solid var(--gold)}
td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
td.r,th.r{text-align:right;white-space:nowrap}
tr.sub td{font-family:var(--display);font-size:18px;color:var(--green);padding-top:18px}
tr.tot td{font-weight:600;border-bottom:0;border-top:1px solid var(--gold);padding-top:12px}
.lvl{display:block;margin-top:2px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-text)}
@media (max-width:520px){th{letter-spacing:.08em;padding:8px 4px}td{padding:9px 4px}table{font-size:13.5px}}
ul.clean{list-style:none;padding:0;margin:0 0 12px;display:grid;gap:10px}
ul.clean li{padding-left:22px;position:relative;max-width:66ch}
ul.clean li::before{content:"";position:absolute;left:0;top:.75em;width:10px;height:1px;background:var(--gold)}
.steps{display:grid;counter-reset:s;margin:8px 0 12px}
.steps div{display:grid;grid-template-columns:42px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.steps div::before{counter-increment:s;content:counter(s);font-family:var(--display);font-size:26px;color:var(--gold-text);line-height:1}
.steps p{margin:0}
.steps b{font-weight:500}
.rates{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin:12px 0}
.rate{border:1px solid var(--line);padding:16px 18px;min-width:0}
.rate .n{font-family:var(--display);font-size:28px;color:var(--green)}
.rate p{font-size:14px;margin:6px 0 0}
.full{margin-top:20px;border:1px solid var(--line);background:var(--ivory)}
.full summary{cursor:pointer;padding:16px 18px;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--green);font-weight:600}
.ctext{max-height:70vh;overflow-y:auto;padding:4px 18px 22px;border-top:1px solid var(--line);font-size:13.5px;line-height:1.6;overflow-wrap:anywhere}
.ctext h3.c1{font-family:var(--display);font-weight:500;font-size:24px;color:var(--green);margin:16px 0 6px}
.ctext h4{font-family:var(--display);font-weight:600;font-size:18px;color:var(--green);margin:22px 0 6px}
.ctext h5{font-size:13px;margin:14px 0 4px}
.ctext p{margin:0 0 9px;max-width:none}
.ctext ul{margin:0 0 10px;padding-left:18px}
.ctab{display:grid;gap:8px;margin:6px 0 12px}
.crow{border:1px solid var(--line);background:var(--paper);padding:10px 12px;display:grid;gap:4px}
.crow span{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-text)}
.live{font-weight:600;color:var(--green)}
.sign{background:var(--ivory);border:1px solid var(--line);padding:26px clamp(18px,4vw,32px);margin-top:8px}
.sides{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:24px;margin-top:14px}
.side{min-width:0}
.ls-sig{font-family:var(--display);font-style:italic;font-size:30px;color:var(--green);border-bottom:1px solid var(--line);padding:18px 0 6px;margin:8px 0}
label.f{display:block;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
input[type=text],select{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:0}
input:focus-visible,button:focus-visible,canvas:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.pad{position:relative;border:1px solid var(--line);background:var(--paper)}
canvas{display:block;width:100%;height:150px;touch-action:none;cursor:crosshair}
.pad .hint{position:absolute;left:12px;bottom:8px;font-size:12px;color:var(--muted);pointer-events:none}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-top:10px}
.chk{display:flex;gap:10px;align-items:flex-start;margin:16px 0;font-size:14px}
.chk input{margin-top:4px;accent-color:var(--green);width:18px;height:18px;flex:none}
button{font:inherit;cursor:pointer}
.link{background:none;border:0;color:var(--gold-text);font-size:13px;text-decoration:underline;padding:0}
.cta{background:var(--green);color:var(--ivory);border:0;padding:16px 28px;font-size:14px;letter-spacing:.18em;text-transform:uppercase;width:100%;margin-top:6px;min-height:52px}
.cta:disabled{background:#9AA79C;cursor:not-allowed}
.ghost{background:none;border:1px solid var(--green);color:var(--green);padding:12px 22px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;margin-top:16px}
.msg{font-size:13px;color:var(--gold-text);min-height:1.2em;margin-top:8px}
.done{text-align:center;padding:30px 10px}
.done h2{font-size:30px}
.done p{margin-inline:auto}
.done .seal{font-size:12px;color:var(--muted);margin-top:14px;line-height:1.8}
.done .sigimg{display:block;margin:14px auto 0;max-width:260px;width:70%;height:auto;border-bottom:1px solid var(--line)}
.state{max-width:560px;margin:12vh auto;text-align:center;color:var(--muted)}
.state h1{font-size:34px}
.foot{background:var(--deep);color:#DDD5C3;font-size:12px;line-height:1.8;padding:22px clamp(20px,6vw,64px);text-align:center}
.foot b{color:var(--gold);font-weight:500;letter-spacing:.2em;text-transform:uppercase;font-size:11px}
td:has(>.pick){padding:4px 2px}
.pick{all:unset;box-sizing:border-box;cursor:pointer;display:inline-block;min-height:40px;padding:8px 6px;white-space:nowrap;text-align:right;border:1px solid transparent;font-variant-numeric:tabular-nums}
.pick:hover{border-color:var(--line)}
.pick[aria-pressed="true"]{background:var(--green);color:var(--gold);border-color:var(--green);font-weight:600}
.pick:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.pick:disabled{cursor:default}
.plans{margin:16px 0 4px}
.engs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--green);margin:0 0 14px;max-width:520px}
.engs button{all:unset;box-sizing:border-box;cursor:pointer;padding:8px 6px;font-size:13px;line-height:1.25;color:var(--green);min-height:48px;display:flex;align-items:center;justify-content:center;text-align:center}
.engs button+button{border-left:1px solid var(--green)}
.engs button[aria-pressed="true"]{background:var(--green);color:var(--gold);font-weight:600}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px}
.plan{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:2px;padding:14px;min-width:0;border:1px solid var(--line);background:var(--paper);min-height:132px}
.plan:hover{border-color:var(--gold)}
.plan .pn{font-family:var(--display);font-size:24px;color:var(--green);line-height:1.1}
.plan .pc{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-text)}
.plan .pp{font-family:var(--display);font-size:26px;color:var(--green);margin-top:auto;font-variant-numeric:tabular-nums;line-height:1.1}
.plan .pp small{font-family:var(--body);font-size:12px;color:var(--muted)}
.plan .pw{font-size:12px;color:var(--muted);text-decoration:line-through}
.plan .ck{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);visibility:hidden}
.plan[aria-pressed="true"]{background:var(--green);border-color:var(--green)}
.plan[aria-pressed="true"] .pn,.plan[aria-pressed="true"] .pp{color:var(--gold)}
.plan[aria-pressed="true"] .pc,.plan[aria-pressed="true"] .pp small,.plan[aria-pressed="true"] .pw{color:#DDD5C3}
.plan[aria-pressed="true"] .ck{visibility:visible}
.plan:focus-visible,.engs button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.recap{margin:22px 0 6px;border:1px solid var(--gold);background:var(--ivory)}
.recap .rk{padding:14px 18px 4px}
.recap .rl{display:flex;justify-content:space-between;gap:16px;padding:12px 18px;border-top:1px solid var(--line);align-items:baseline}
.recap .rl:first-of-type{border-top:0}
.recap .rl div{min-width:0}
.recap .rl b{font-weight:500}
.recap .rl small{display:block;font-size:12.5px;color:var(--muted)}
.recap .rl .n{font-variant-numeric:tabular-nums;white-space:nowrap;font-size:16px}
.recap .rl.tot{background:var(--green);color:var(--ivory);border-top:0}
.recap .rl.tot b,.recap .rl.tot .n{color:var(--gold);font-family:var(--display);font-size:24px;font-weight:500}
.recap .rl.tot b{line-height:1.15;display:block}
@media (min-width:600px){.pick{min-width:92px;padding:8px 10px}}
.recap .rl.tot small{color:#DDD5C3}
.recap .rl.due .n{font-weight:600}
.recap p.small{margin:0;padding:10px 18px 14px}
.plus{font-size:13.5px;color:var(--muted);margin:2px 0 0}
.plus a{color:var(--gold-text)}
.hidden{display:none!important}
@media (prefers-reduced-motion:no-preference){.done{animation:f .5s ease-out}@keyframes f{from{opacity:.4}to{opacity:1}}}
@media print{body{padding:0;background:#fff}.sheet{border:0}.note,.noprint,.cta,.ghost,.link{display:none!important}.ctext{max-height:none;overflow:visible}section{break-inside:auto}.band,.fig.main,.foot{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>

  return clean(D.contract).replace(/\{\{formula\}\}/g, `<span class="live" data-live="formula">${esc(f ? f.n : "")}</span>`)
    .replace(/\{\{party\}\}/g, esc((D.client || {}).party || "")).replace(/\{\{(\w+)\}\}/g, (m, k) => V[k] != null ? esc(V[k]) : m);
}

/* the house's light markup: blank line = paragraph; "- " list, "+ " steps, "# " statement, "> " box, "~ " note, [[widget]] */
function blocks(body) {
  return String(body || "").replace(/\r/g, "").split(/\n\s*\n/).map(b => b.trim()).filter(Boolean).map(b => {
    const w = b.match(/^\[\[(\w+)\]\]$/); if (w) return widget(w[1]);
    const lines = b.split("\n");
    if (lines.every(l => /^- /.test(l))) return `<ul class="clean">${lines.map(l => `<li>${inline(l.slice(2))}</li>`).join("")}</ul>`;
    if (lines.every(l => /^\+ /.test(l))) return `<div class="steps">${lines.map(l => `<div><p>${inline(l.slice(2))}</p></div>`).join("")}</div>`;
    if (/^# /.test(b)) return `<p class="statement">${inline(b.slice(2))}</p>`;
    if (/^> /.test(b)) return `<p class="box">${b.slice(2).split("\n").map(inline).join("<br>")}</p>`;   // a box may hold several lines (« Une estimation, et non un forfait », 17 Oct 2026)
    if (/^~ /.test(b)) return `<p class="small">${inline(b.slice(2))}</p>`;
    return `<p>${lines.map(inline).join("<br>")}</p>`;
  }).join("");
}
function widget(k) {
  const T = D.totals || {}, F = D.formulas || {};
  if (k === "figures" && D.kind === "project" && (D.project || {}).mode === "firm") return `<div class="figures">
    <div class="fig main"><div class="label">${t("figPrice")}</div><div class="n">${esc(money(T.price))}</div><small>${t("figPriceSub")}</small></div>
    <div class="fig"><div class="label">${t("figProv")}</div><div class="n">${esc(money(T.provision))}</div><small>${t("figProvSub")}</small></div></div>`;
  if (k === "scope") return blocks((D.project || {}).scope);
  if (k === "figures") return `<div class="figures">
    <div class="fig main"><div class="label">${t("figEst")}</div><div class="n">${esc(money(T.amount))}</div><small>${t("figEstSub")}</small></div>
    <div class="fig"><div class="label">${t("figRange")}</div><div class="n">${esc(money(T.low))} – ${esc(money(T.high))}</div><small>${t("figRangeSub")}</small></div>
    <div class="fig"><div class="label">${t("figCap")}</div><div class="n">${esc(money(T.cap))}</div><small>${t("figCapSub")}</small></div>
    <div class="fig"><div class="label">${t("figProv")}</div><div class="n">${TEST() ? esc(TEST().due) : esc(money(T.provision))}</div><small>${TEST() ? esc(TEST().title) : t("figProvSub")}</small></div></div>${plusLine()}`;
  // only the levels ticked for this quote (Dylan, 18 Oct 2026); an older quote without the choice shows both house levels
  const lvOn = id => !Array.isArray(D.lvSel) || D.lvSel.includes(id);
  if (k === "rates") return `<div class="rates">${lvOn("F") ? `
    <div class="rate"><div class="label">${t("rateF")}</div><div class="n">${esc(money(D.rates.F))} ${t("perHour")}</div><p>${t("rateFText")}</p></div>` : ""}${lvOn("O") ? `
    <div class="rate"><div class="label">${t("rateO")}</div><div class="n">${esc(money(D.rates.O))} ${t("perHour")}</div><p>${t("rateOText")}</p></div>` : ""}${(D.levels || []).map(x => `
    <div class="rate"><div class="label">${esc(x.name)}</div><div class="n">${esc(money(x.rate))} ${t("perHour")}</div></div>`).join("")}</div>`;
  if (k === "detail") return `<table><thead><tr><th>${t("thPost")}</th><th class="r">${t("thHours")}</th><th class="r">${t("thAmount")}</th></tr></thead><tbody>
    ${(D.groups || []).map(g => `<tr class="sub"><td colspan="3">${esc(g.t)}</td></tr>` + g.lines.map(l => `<tr><td>${esc(l.n)}<span class="lvl">${l.lv === "F" ? t("lvF") : (((D.levels || []).find(x => x.id === l.lv) || {}).name ? esc((D.levels || []).find(x => x.id === l.lv).name) : t("lvO"))}</span></td><td class="r">${hours(l.h)}</td><td class="r">${esc(money(l.a))}</td></tr>`).join("")).join("")}
    <tr class="tot"><td>${t("total")}</td><td class="r">${hours(T.h)}</td><td class="r">${esc(money(T.amount))}</td></tr></tbody></table>`;
  if (k === "formulas") { const E = F.engagements || [];
    if (pickable()) return `<div class="plans" data-plans id="plans">${plansHTML()}</div><p class="small noprint">${t("pickHint")}</p>
      <div class="noprint fullgrid" style="margin:14px 0 0"><p class="small" style="margin:0 0 4px;color:var(--gold-text)">${t("fullGrid")}</p>${gridHTML()}</div>`;   // always open (Dylan, 13 Oct 2026: no click needed)
    return `<table><thead><tr><th>${t("thFormula")}</th>${E.map(e => `<th class="r">${+e.y === 1 ? t("engNone") : t("engYears", { y: e.y })}</th>`).join("")}</tr></thead><tbody>
      ${(F.list || []).map(f => `<tr><td>${esc(f.n)}<span class="lvl">${t("credits", { n: f.credits })}</span></td>${f.prices.map((p, i) => `<td class="r">${pickable() ? `<button type="button" class="pick" data-k="${esc(f.k)}" data-y="${+((E[i] || {}).y || 1)}" aria-pressed="false">${esc(money(p))}</button>` : esc(money(p))}</td>`).join("")}</tr>`).join("")}</tbody></table>
      ${hasRecap() && !(Q && Q.signed) ? `<div id="recap" data-recap>${recapHTML()}</div>` : ""}`; }
  if (k === "contract") return `<details class="full" id="contrat"><summary>${t("contractOpen")}</summary><div class="ctext">${contractHTML()}</div></details>`;
  return "";
}
let SEL = null;
const sel = () => { if (!SEL) { const F = D.formulas || {}; SEL = Q && Q.signed ? { k: Q.formula, y: +Q.engagement || 1 } : { k: F.def, y: +F.defEng || 1 }; } return SEL; };
const curFormula = () => { const k = sel().k; return ((D.formulas || {}).list || []).find(f => f.k === k) || ((D.formulas || {}).list || [])[0]; };
const hasRecap = () => D.kind !== "project" && ((D.formulas || {}).list || []).length > 0;
const pickable = () => hasRecap() && !(Q && (Q.signed || Q.expired));
const priceOf = (f, y) => { const E = (D.formulas || {}).engagements || [], i = E.findIndex(e => +e.y === +y); return f ? +(f.prices || [])[i < 0 ? 0 : i] || 0 : 0; };
function plusLine() {
  if (!hasRecap()) return "";
  const all = ((D.formulas || {}).list || []).flatMap(f => (f.prices || []).map(Number)).filter(n => n > 0); if (!all.length) return "";
  return `<p class="plus">${t("figPlus", { min: money(Math.min(...all)), max: money(Math.max(...all)) })} <a href="#recap" class="noprint">${t("seeTotal")}</a></p>`;
}
/* Client test, non facturé (13 Oct 2026): a pilot collection, offered; texts frozen in doc.test by The Legacy */
const TEST = () => D.test && typeof D.test === "object" ? D.test : null;
function testBox() { const x = TEST(); if (!x) return "";

/* the whole first year in one place: putting in order (estimate) + the plan chosen, what is due on signature, what follows */
function recapHTML() {
  const T = D.totals || {}, f = curFormula(), y = sel().y, p = priceOf(f, y), est = +T.amount || 0, due = (+T.provision || 0) + p;
  const ex = { formula: f ? f.n : "", credits: f ? fill(lab("credits"), Object.assign({}, V, { n: f.credits })) : "", engagement: engLabel(y), hours: hours(T.h), cap: money(T.cap), provisionPct: V.provisionPct != null ? V.provisionPct : (T.provisionPct || ""), price: money(p) };
  return `<div class="recap"><div class="rk label">${t("recapKicker")}</div>
    <div class="rl"><div><b>${t("recapOrder")}</b><small>${t("recapOrderSub", ex)}</small></div><span class="n">${esc(money(est))}</span></div>
    <div class="rl"><div><b>${t("recapFormula", ex)}</b><small>${t("recapFormulaSub", ex)}</small></div><span class="n" data-v="formula">${esc(money(p))}</span></div>
    <div class="rl tot"><div><b>${t("recapTotal")}</b><small>${t("recapTotalSub")}</small></div><span class="n" data-v="total">${esc(money(est + p))}</span></div>
    <div class="rl due"><div><b>${t("recapDue")}</b><small>${TEST() ? esc(TEST().title) : t("recapDueSub", ex)}</small></div><span class="n" data-v="due">${TEST() ? esc(TEST().due) : esc(money(due))}</span></div>
    <p class="small">${TEST() ? esc(TEST().text) : t("recapAfter") + (+y > 1 ? " " + t("recapNext", ex) : "")}</p></div>`;
}
/* every plan at a glance (Dylan, 13 Oct 2026): the commitment in one row of buttons, then one card per plan with its yearly
   price for that commitment; one touch chooses. Same choice everywhere (cards, grid, signature, contract, total). */
function plansHTML() {
  const F = D.formulas || {}, E = F.engagements || [], s = sel();
  return `${E.length > 1 ? `<div class="engs" role="group" aria-label="${t("engagement")}">${E.map(e => `<button type="button" class="engb" data-y="${+e.y}" aria-pressed="${+e.y === +s.y}">${esc(engLabel(e.y)).replace(" (", "<br>(").replace(/ %/g, "\u00a0%")}</button>`).join("")}</div>` : ""}
    <div class="cards">${(F.list || []).map(f => { const p = priceOf(f, s.y), p1 = priceOf(f, 1);
      return `<button type="button" class="plan" data-k="${esc(f.k)}" aria-pressed="${f.k === s.k}"><span class="ck">${t("chosen")}</span><span class="pn">${esc(f.n)}</span><span class="pc">${t("credits", { n: f.credits })}</span>
        <span class="pp">${esc(money(p))} <small>${t("perYear")}</small></span>${+s.y > 1 && p1 > p ? `<span class="pw">${esc(money(p1))}</span>` : ""}</button>`; }).join("")}</div>`;
}
function gridHTML() { const F = D.formulas || {}, E = F.engagements || [];
  return `<table><thead><tr><th>${t("thFormula")}</th>${E.map(e => `<th class="r">${+e.y === 1 ? t("engNone") : t("engYears", { y: e.y })}</th>`).join("")}</tr></thead><tbody>
      ${(F.list || []).map(f => `<tr><td>${esc(f.n)}<span class="lvl">${t("credits", { n: f.credits })}</span></td>${f.prices.map((p, i) => `<td class="r"><button type="button" class="pick" data-k="${esc(f.k)}" data-y="${+((E[i] || {}).y || 1)}" aria-pressed="false">${esc(money(p))}</button></td>`).join("")}</tr>`).join("")}</tbody></table>`; }
function setSel(k, y) {
  const F = D.formulas || {}; if (!(F.list || []).some(f => f.k === k)) return; if (!(F.engagements || []).some(e => +e.y === +y)) y = 1;
  SEL = { k, y: +y }; paintSel();
}
function paintSel() {
  const s = sel(), f = curFormula();
  document.querySelectorAll(".pick").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.k === s.k && +b.dataset.y === +s.y)));
  document.querySelectorAll("[data-recap]").forEach(x => { x.innerHTML = recapHTML(); });
  document.querySelectorAll("[data-plans]").forEach(x => { x.innerHTML = plansHTML(); });
  document.querySelectorAll('[data-live="formula"]').forEach(x => { x.textContent = f ? f.n : ""; });
  const fm = $("#fm"), en = $("#en"); if (fm && fm.value !== s.k) fm.value = s.k; if (en && +en.value !== +s.y) en.value = String(s.y);
}
document.addEventListener("click", e => { if (!e.target.closest || !pickable()) return;
  const b = e.target.closest(".pick"); if (b) { setSel(b.dataset.k, b.dataset.y); return; }
  const c = e.target.closest(".plan"); if (c) { setSel(c.dataset.k, sel().y); return; }
  const g = e.target.closest(".engb"); if (g) setSel(sel().k, +g.dataset.y); });
const engLabel = y => { const e = ((D.formulas || {}).engagements || []).find(x => +x.y === +y) || { y: 1, pct: 0 }; return +e.y === 1 ? fill(L.engNone, V) : fill(L.engOption, Object.assign({}, V, { y: e.y, pct: e.pct })); };

function signBlock() {
  if (Q.signed) {
    const f = ((D.formulas || {}).list || []).find(x => x.k === Q.formula);
    return `<div class="done"><div class="label">${t("signedKicker")}</div><h2>${t("thanks", { name: Q.signer_name })}</h2>
      <p>${t("thanksText")}</p>
      ${Q.signature ? `<img class="sigimg" src="${esc(Q.signature)}" alt="${esc(ui.sigTitle)}">` : ""}
      <div class="seal">${esc(Q.signer_name)}<br>${t("seal", { formula: f ? f.n : Q.formula, engagement: engLabel(Q.engagement) })}<br>${t("signedAt", { when: fwhen(Q.signed_at) })}<br>${t("refLine", { ref: D.ref })}${TEST() ? `<br>${esc(TEST().seal)}` : ""}${Q.doc_hash ? `<br><span style="font-size:10px;opacity:.7">SHA-256 ${esc(Q.doc_hash)}</span>` : ""}</div>
      ${hasRecap() ? `<div data-recap style="text-align:left">${recapHTML()}</div>` : ""}
      <button type="button" class="ghost" id="print">${esc(ui.print)}</button></div>`;
  }
  if (Q.expired) return `<div class="done"><div class="label">${t("signKicker")}</div><p>${t("expired", { date: fdate(D.validUntil) })}</p></div>`;
  const F = D.formulas || {}, co = D.company || {};
  return `<div class="label">${t("signKicker")}</div><h2>${t("signTitle")}</h2>
    ${hasRecap() ? `<div id="recap" data-recap>${recapHTML()}</div><p class="small noprint" style="margin:6px 0 0"><a href="#plans" style="color:var(--gold-text)">${t("changePlan")}</a></p>` : ""}
    <div class="sides"><div class="side"><label class="f">${esc(co.name)}</label><div class="ls-sig">${esc(co.signer)}</div>
        <p class="small">${esc([co.signer, co.signerTitle].filter(Boolean).join(", "))}<br>${esc(fdate(D.date))}</p></div>
      <div class="side"><label class="f" for="nm">${t("yourName")}</label><input type="text" id="nm" autocomplete="name" maxlength="160">
        <label class="f" for="cv">${t("yourSig")}</label>
        <div class="pad"><canvas id="cv" tabindex="0" aria-label="${t("yourSig")}"></canvas><span class="hint" id="hint">${t("sigHint")}</span></div>
        <div class="row"><button type="button" class="link" id="clr">${t("clear")}</button></div></div></div>
    ${D.contract ? `<p style="margin:18px 0 0;font-size:13.5px"><a href="#contrat" id="toContract" style="color:var(--gold-text)">${t("reread")}</a></p>` : ""}
    <div class="sides hidden" style="margin-top:6px">
      <div class="side"><label class="f" for="fm">${t("yourFormula")}</label><select id="fm">${(F.list || []).map(f => `<option value="${esc(f.k)}" ${f.k === sel().k ? "selected" : ""}>${esc(f.n)} · ${t("credits", { n: f.credits })}</option>`).join("")}</select></div>
      <div class="side"><label class="f" for="en">${t("engagement")}</label><select id="en">${(F.engagements || []).map(e => `<option value="${+e.y}" ${+e.y === +sel().y ? "selected" : ""}>${esc(engLabel(e.y))}</option>`).join("")}</select></div></div>
    <label class="chk"><input type="checkbox" id="ok"><span>${t("accept")}</span></label>
    <button type="button" class="cta" id="go" disabled>${t("signBtn")}</button>
    <div class="msg" id="msg"></div>`;
}

function render() {
  const co = D.company || {}, cl = D.client || {};
  document.documentElement.lang = D.lang === "en" ? "en" : "fr";
  document.title = [fill(L.title, V), D.ref].filter(Boolean).join(" · ");
  $("#app").innerHTML = `${SELF ? `<div class="note">${esc(PREVIEW ? ui.draft : ui.preview)}</div>` : ""}
  <article class="sheet">
    <header class="band"><img src="${LOGO}" alt="${esc(co.name)}">${L.band ? `<div class="co">${t("band")}</div>` : ""}</header>
    <div class="in">
      <div class="label">${t("kicker")}</div><h1>${t("title")}</h1><p class="sub">${t("subtitle")}</p>
      <div class="meta"><div><span>${t("for")}</span><b>${esc(cl.party || cl.name)}</b></div><div><span>${t("ref")}</span><b>${esc(D.ref)}</b></div>
        <div><span>${t("date")}</span><b>${esc(fdate(D.date))}</b></div><div><span>${t("valid")}</span><b>${esc(fdate(D.validUntil))}</b></div></div>
      ${testBox()}
      ${(D.sections || []).map(s => `<section${s.id ? ` data-s="${esc(s.id)}"` : ""}>${s.label ? `<div class="label">${inline(s.label)}</div>` : ""}${s.title ? `<h2>${inline(s.title)}</h2>` : ""}${blocks(s.body)}</section>`).join("")}
      <section id="signer"><div class="sign" id="signBox">${signBlock()}</div></section>
    </div>
    <footer class="foot"><b>${esc(co.name)}</b><br>${esc(String(co.address || "").split(/\n+/).join(" · "))}<br>${esc([L.licence && co.licence ? fill(L.licence, { licence: co.licence }) : "", co.email, co.phone].filter(Boolean).join(" · "))}</footer>
  </article>`;
  wire(); paintSel();
}

function wire() {
  const pr = $("#print"); if (pr) pr.onclick = () => { const c = $("#contrat"); if (c) c.open = true; window.print(); };
  const tc = $("#toContract"); if (tc) tc.addEventListener("click", () => { const c = $("#contrat"); if (c) c.open = true; });
  const cv = $("#cv"); if (!cv) return;
  const ctx = cv.getContext("2d"), hint = $("#hint"), nm = $("#nm"), ok = $("#ok"), go = $("#go"), msg = $("#msg"), fm = $("#fm");
  let drawn = false, down = false, last = null;
  function size() { const r = cv.getBoundingClientRect(), d = window.devicePixelRatio || 1, img = drawn ? cv.toDataURL() : null;
    cv.width = Math.round(r.width * d); cv.height = Math.round(r.height * d); ctx.setTransform(d, 0, 0, d, 0, 0);
    ctx.lineWidth = 2; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = "#16241A";
    if (img) { const i = new Image(); i.onload = () => ctx.drawImage(i, 0, 0, r.width, r.height); i.src = img; } }
  size(); addEventListener("resize", size);
  const pt = e => { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  cv.addEventListener("pointerdown", e => { if (SELF) return; down = true; last = pt(e); try { cv.setPointerCapture(e.pointerId); } catch (x) {} });
  cv.addEventListener("pointermove", e => { if (!down) return; const p = pt(e); ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke(); last = p;
    if (!drawn) { drawn = true; hint.hidden = true; check(); } });
  ["pointerup", "pointercancel", "pointerleave"].forEach(ev => cv.addEventListener(ev, () => { down = false; }));
  $("#clr").onclick = () => { ctx.clearRect(0, 0, cv.width, cv.height); drawn = false; hint.hidden = false; check(); };
  function check() { go.disabled = SELF || !(nm.value.trim().length > 2 && drawn && ok.checked);
    msg.textContent = SELF ? (PREVIEW ? ui.draft : ui.preview) : go.disabled ? fill(L.needAll, V) : ""; }
  nm.addEventListener("input", check); ok.addEventListener("change", check); check();
  fm.addEventListener("change", () => setSel(fm.value, +$("#en").value));
  const enS = $("#en"); if (enS) enS.addEventListener("change", () => setSel(fm.value, +enS.value));
  function sigData() { // a light PNG of the drawn signature (white background), same proportions
    const w = Math.min(900, cv.width), h = Math.round(cv.height * w / cv.width), o = document.createElement("canvas"); o.width = w; o.height = h;
    const c = o.getContext("2d"); c.fillStyle = "#fff"; c.fillRect(0, 0, w, h); c.drawImage(cv, 0, 0, w, h); return o.toDataURL("image/png"); }
  go.onclick = async () => {
    if (go.disabled || SELF) return; go.disabled = true; const label = go.textContent; go.textContent = ui.signing; msg.textContent = "";
    const name = nm.value.trim(), f = fm.value, y = +$("#en").value;
    let r = null; try { r = await rpc("quote_sign", { p_token: token, p_name: name, p_signature: sigData(), p_formula: f, p_engagement: y, p_device: DEVICE }); } catch (e) { r = null; }
    if (r && r.ok) {
      try { fetch(`${SB_URL}/functions/v1/scoping-notify`, { method: "POST", keepalive: true, headers: { "apikey": SB_KEY, "Content-Type": "application/json" }, body: JSON.stringify({ token, event: "signed" }) }).catch(() => {}); } catch (e) {}
      Object.assign(Q, { signed: true, signed_at: r.signed_at, signer_name: name, formula: f, engagement: y, signature: sigData(), doc_hash: r.doc_hash });
      $("#signBox").innerHTML = signBlock(); wire(); $("#signBox").scrollIntoView({ block: "start" }); return; }
    if (r && r.reason === "already") { SEL = null; await load(); return; }
    if (r && r.reason === "expired") { Q.expired = true; $("#signBox").innerHTML = `<p class="msg">${esc(ui.expiredNow)}</p>` + signBlock(); return; }
    go.disabled = false; go.textContent = label; msg.textContent = fill(ui.fail, { btn: label });
  };
}

async function rpc(name, body) {
  const r = await fetch(`${SB_URL}/rest/v1/rpc/${name}`, { method: "POST", headers: { "apikey": SB_KEY, "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (!r.ok) throw new Error("http " + r.status);
  return r.json();
}
function stateView(title, text) { $("#app").innerHTML = `<div class="state"><img src="${LOGO}" alt="" style="width:120px;background:var(--deep);padding:14px 18px"><h1 class="h">${esc(title)}</h1><p>${esc(text)}</p></div>`; }

function previewWait() {
  $("#app").innerHTML = `<div class="state">${esc(ui.loading)}</div>`;
  if (window.parent === window) { stateView(ui.closedT, ui.closed); return; }
  addEventListener("message", e => {
    const m = e.data;
    if (!PREVIEW_OK(e.origin) || e.source !== window.parent || !m || m.ls !== "preview" || m.kind !== "quote" || !m.doc || typeof m.doc !== "object") return;
    try { SEL = null; Q = { ok: true, doc: m.doc, signed: false, expired: false }; D = m.doc; ui = UI[D.lang === "en" ? "en" : "fr"]; L = D.labels || {}; V = Object.assign({}, D.vars || {});
      const y = scrollY; render(); scrollTo(0, y); }
    catch (x) { stateView(ui.closedT, ui.closed); }
  });
  window.parent.postMessage({ ls: "preview-ready", kind: "quote" }, "*");   // carries nothing: The Legacy answers only to its own office page
}

async function load() {
