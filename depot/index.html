<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#F4F0E6">
<title>Legacy Shaper · Collection Office</title>
<link rel="icon" href="../icon-192.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Hanken+Grotesk:wght@300;400;500;600&display=swap">
<style>
:root{--deep:#1B3924;--green:#244A30;--ink:#16241A;--gold:#C4A052;--goldtxt:#7A6332;--soft:#E9DDBE;--ivory:#F4F0E6;--paper:#FBF8F1;--line:rgba(36,74,48,.16);--muted:#5d6b60}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ivory);color:var(--ink);font:400 16px/1.55 "Hanken Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.wrap{max-width:760px;margin:0 auto;padding:calc(28px + env(safe-area-inset-top,0px)) 16px calc(40px + env(safe-area-inset-bottom,0px))}
.top{display:flex;justify-content:flex-end;min-height:28px}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{all:unset;cursor:pointer;padding:5px 12px;font:500 11px/1 "Hanken Grotesk",sans-serif;letter-spacing:2px;color:var(--muted)}
.lang button.on{background:var(--green);color:var(--ivory)}
.hero{text-align:center;padding:6px 0 22px}
.logo{display:block;margin:0 auto 22px;width:150px;height:auto}
.kick{font:500 11px/1 "Hanken Grotesk",sans-serif;letter-spacing:4px;text-transform:uppercase;color:var(--goldtxt)}
h1{font:500 clamp(34px,7vw,46px)/1.08 "Cormorant Garamond",Georgia,serif;color:var(--green);margin:12px 0 18px}
.rule{width:56px;height:1px;background:var(--gold);margin:0 auto 18px}
.lead{font:400 clamp(19px,3.6vw,21px)/1.5 "Cormorant Garamond",Georgia,serif;color:var(--ink);max-width:600px;margin:0 auto 12px}
.how{font-size:14px;color:var(--muted);max-width:560px;margin:0 auto}
.preview{border:1px dashed var(--gold);border-radius:10px;padding:8px 12px;font-size:14px;color:var(--goldtxt);text-align:center;margin:0 0 14px}
.progress{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 6px}
.progress div{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}
.progress b{display:block;font:500 22px/1.1 "Cormorant Garamond",Georgia,serif;color:var(--green)}
.progress span{font:500 10px/1.3 "Hanken Grotesk",sans-serif;letter-spacing:1.5px;text-transform:uppercase;color:var(--goldtxt)}
@media (max-width:480px){.progress{grid-template-columns:repeat(2,1fr)}}
section{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:22px 18px 12px;margin:18px 0}
h2{font:500 26px/1.15 "Cormorant Garamond",Georgia,serif;color:var(--green);margin:0 0 4px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
h2 .cnt{font:500 12px/1 "Hanken Grotesk",sans-serif;letter-spacing:1px;color:var(--goldtxt);white-space:nowrap}
.sub{font-size:14px;color:var(--muted);margin:2px 0 10px}
.drop{display:block;border:1.5px dashed rgba(36,74,48,.4);border-radius:14px;background:#fff;padding:26px 16px;text-align:center;cursor:pointer;transition:background .15s,border-color .15s}
.drop.over{background:var(--soft);border-color:var(--green)}
.drop b{display:block;font:500 21px/1.3 "Cormorant Garamond",Georgia,serif;color:var(--green);margin-bottom:6px}
.drop span{font-size:14px;color:var(--muted)}
.acts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:14px 0 6px}
.btn{appearance:none;-webkit-appearance:none;cursor:pointer;border:0;border-radius:999px;background:var(--deep);color:var(--ivory);padding:14px 24px;font:500 12px/1 "Hanken Grotesk",sans-serif;letter-spacing:2.5px;text-transform:uppercase;min-height:46px}
.btn.ghost{background:transparent;color:var(--green);border:1px solid var(--green)}
.btn:disabled{opacity:.55;cursor:default}
.files{list-style:none;margin:12px 0 0;padding:0}
.files li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.files li span:first-child{overflow-wrap:anywhere;min-width:0}
.files li span:last-child{color:var(--muted);white-space:nowrap}
.item{padding:14px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.ql{margin:0 0 9px}
.ql small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{appearance:none;-webkit-appearance:none;cursor:pointer;border:1px solid rgba(36,74,48,.28);background:#fff;color:var(--ink);border-radius:999px;padding:8px 13px;font:400 14px/1.2 "Hanken Grotesk",sans-serif;min-height:38px}
.pill[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--ivory)}
.pill:focus-visible,.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.got{font-size:13px;color:var(--green);margin-top:8px}
select.t,input.t{width:100%;border:1px solid rgba(36,74,48,.28);background:#fff;border-radius:10px;padding:11px 12px;font:400 16px/1.2 "Hanken Grotesk",sans-serif;color:var(--ink)}
select.t{margin-top:8px}
.card{border:1px solid var(--line);border-radius:12px;background:#fff;padding:14px;margin:10px 0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.row2{grid-template-columns:1fr}}
label.f{display:block;font-size:13px;color:var(--muted);margin:8px 0 5px}
.chk{display:flex;gap:10px;align-items:flex-start;margin-top:10px;font-size:14px}
.chk input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--green)}
.rm{all:unset;cursor:pointer;color:var(--goldtxt);font-size:13px;margin-top:10px;display:inline-block}
.letter{border:1px solid var(--line);border-radius:12px;background:#fff;padding:16px;margin:10px 0;font:400 17px/1.5 "Cormorant Garamond",Georgia,serif}
.letter .to{font:500 11px/1 "Hanken Grotesk",sans-serif;letter-spacing:2px;text-transform:uppercase;color:var(--goldtxt);margin-bottom:8px}
.letter .draft{font:400 13px/1.4 "Hanken Grotesk",sans-serif;color:var(--goldtxt);margin-top:8px}
canvas.sig{display:block;width:100%;height:150px;border:1px solid rgba(36,74,48,.28);border-radius:10px;background:#fff;touch-action:none}
.signed{color:var(--green);font-size:14px;margin-top:8px}
.done{text-align:center;padding:24px 4px 6px}
.done p{font:400 21px/1.5 "Cormorant Garamond",Georgia,serif;max-width:540px;margin:0 auto 12px}
.note{font-size:14px;color:var(--muted);text-align:center;margin:10px auto 0;max-width:560px}
.foot{text-align:center;font:500 10px/1.6 "Hanken Grotesk",sans-serif;letter-spacing:3px;text-transform:uppercase;color:var(--goldtxt);margin-top:30px}
.hidden{display:none!important}
</style>
</head>

const ITEM_KEYS = ["list", "photos", "invoices", "certificates", "condition", "values", "provenance", "customs", "framing", "insurance", "storage", "ownership", "loans"];
const ANS = ["share", "none", "ask", "na"];
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let lang = Q.get("lang") === "en" ? "en" : "fr";
let S = { files: [], items: {}, places: [], people: [], signedAt: null, signedFor: [] };
let target = null;   // the line a file is shared for (null = « en vrac »)

function letters() { return S.people.filter(p => p.direct && (p.name || p.company)); }
function counts() {
  const ans = k => S.items[k] && S.items[k].a;
  return { works: ITEM_KEYS.slice(0, 9).filter(ans).length, docs: ITEM_KEYS.slice(9).filter(ans).length, places: S.places.filter(p => p.name || p.address).length, people: S.people.filter(p => p.name || p.company).length };
}
function itemHTML(k, i) {
  const t = T[lang], it = S.items[k] || {}, [label, help] = t.items[i];
  const who = S.people.filter(p => p.name || p.company);
  const got = S.files.filter(f => f.item === k).length;
  return `<div class="item" id="it_${k}"><p class="ql">${esc(label)}${help ? `<small>${esc(help)}</small>` : ""}</p>
    <div class="pills" role="group">${ANS.map((a, j) => `<button type="button" class="pill" aria-pressed="${it.a === a}" data-item="${k}" data-a="${a}">${esc(t.ans[j])}</button>`).join("")}</div>
    ${it.a === "ask" ? (who.length ? `<select class="t" data-askfor="${k}"><option value="">${esc(t.askWho)}</option>${who.map(p => `<option value="${p.id}"${it.who === p.id ? " selected" : ""}>${esc([p.name, p.company].filter(Boolean).join(" · "))}</option>`).join("")}</select>` : `<p class="sub" style="margin-top:8px">${esc(t.askNone)}</p>`) : ""}
    ${got ? `<p class="got">✓ ${esc(t.received(got))}</p>` : ""}</div>`;
}
function placeHTML(p, i) {
  const t = T[lang];
  return `<div class="card"><div class="row2"><div><label class="f">${esc(t.placeName)}</label><input class="t" data-place="${i}" data-k="name" value="${esc(p.name)}"></div>
    <div><label class="f">${esc(t.placeKind)}</label><select class="t" style="margin:0" data-place="${i}" data-k="kind">${t.placeKinds.map((k, j) => `<option value="${j}"${+p.kind === j ? " selected" : ""}>${esc(k)}</option>`).join("")}</select></div></div>
    <label class="f">${esc(t.address)}</label><input class="t" data-place="${i}" data-k="address" value="${esc(p.address)}">
    <label class="f">${esc(t.onSite)}</label><input class="t" data-place="${i}" data-k="contact" value="${esc(p.contact)}">
    <button type="button" class="rm" data-rmplace="${i}">${esc(t.remove)}</button></div>`;
}
function personHTML(p, i) {
  const t = T[lang];
  return `<div class="card"><div class="row2"><div><label class="f">${esc(t.role)}</label><select class="t" style="margin:0" data-person="${i}" data-k="role">${t.roles.map((r, j) => `<option value="${j}"${+p.role === j ? " selected" : ""}>${esc(r)}</option>`).join("")}</select></div>
    <div><label class="f">${esc(t.pcompany)}</label><input class="t" data-person="${i}" data-k="company" value="${esc(p.company)}"></div></div>
    <div class="row2"><div><label class="f">${esc(t.pname)}</label><input class="t" data-person="${i}" data-k="name" value="${esc(p.name)}"></div>

    <button type="button" class="rm" data-rmperson="${i}">${esc(t.remove)}</button></div>`;
}
function lettersHTML() {
  const t = T[lang], L = letters();
  if (!L.length) return `<p class="sub">${esc(t.eNone)}</p>`;
  const done = S.signedAt && L.every(p => S.signedFor.includes(p.id));
  return L.map(p => `<div class="letter"><div class="to">${esc(t.letterTo)} ${esc([p.name, p.company].filter(Boolean).join(" · "))}</div>${esc(t.letterBody(p.name, p.company))}<div class="draft">${esc(t.letterDraft)}</div></div>`).join("")
    + (done ? `<p class="signed">✓ ${esc(t.signed(L.length))}</p>` : `<label class="f">${esc(t.sign)}</label><canvas class="sig" id="sig"></canvas>
      <div class="acts"><button type="button" class="btn ghost" id="sigClear">${esc(t.clear)}</button><button type="button" class="btn" id="sigOk" disabled>${esc(t.signAll)}</button></div>`);
}
function progressHTML() { const t = T[lang], c = counts();
  return `<div><b>${c.works}/9</b><span>${esc(t.pWorks)}</span></div><div><b>${c.docs}/4</b><span>${esc(t.pDocs)}</span></div><div><b>${c.places}</b><span>${esc(t.pPlaces)}</span></div><div><b>${c.people}</b><span>${esc(t.pPeople)}</span></div>`; }
/* While the client types a place or a contact, only the counters, the letters and the « Demandez-le à… » lists are
   refreshed: the field being typed in is never redrawn (the iPhone keyboard stays open). */
function partial() {
  const pr = $("#progress"); if (pr) pr.innerHTML = progressHTML();
  const lt = $("#letters"); if (lt && !(S.signedAt && letters().every(p => S.signedFor.includes(p.id)))) { lt.innerHTML = lettersHTML(); bindSig(); }
  ITEM_KEYS.forEach((k, i) => { const it = S.items[k]; if (it && it.a === "ask") { const el = $("#it_" + k); if (el) el.outerHTML = itemHTML(k, i); } });
  const c = counts(); document.querySelectorAll("h2 .cnt[data-c]").forEach(e => { e.textContent = c[e.dataset.c] || ""; });
}
function render() {
  const t = T[lang], c = counts();
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el => { const v = t[el.dataset.t]; if (typeof v === "string") el.textContent = v; });
  document.querySelectorAll(".lang button").forEach(b => b.classList.toggle("on", b.dataset.lang === lang));
  if (S.finished) { $("#main").innerHTML = `<section class="done"><p>${esc(t.doneP1)}</p><p>${esc(t.doneP2)}</p>${PREVIEW ? `<p class="note">${esc(t.previewFinish)}</p>` : ""}</section>`; return; }
  $("#main").innerHTML = `
  <div class="progress" id="progress" aria-live="polite">${progressHTML()}</div>
  <section><h2>${esc(t.bulkT)}<span class="cnt">${S.files.length ? esc(t.received(S.files.length)) : ""}</span></h2><p class="sub">${esc(t.bulkS)}</p>
    <label class="drop" id="drop" tabindex="0"><b>${esc(t.dropB)}</b><span>${esc(t.dropS)}</span></label>
    <div class="acts"><button type="button" class="btn ghost" id="camBtn">${esc(t.photo)}</button><button type="button" class="btn ghost" id="pickBtn">${esc(t.files)}</button></div>
    ${S.files.length ? `<ul class="files">${S.files.slice().reverse().map(f => `<li><span>${esc(f.name)}</span><span>${esc(t.now)}</span></li>`).join("")}</ul>` : ""}</section>
  <section><h2>${esc(t.aT)}<span class="cnt">${c.works}/9</span></h2><p class="sub">${esc(t.aS)}</p>${ITEM_KEYS.slice(0, 9).map((k, i) => itemHTML(k, i)).join("")}</section>
  <section><h2>${esc(t.bT)}<span class="cnt">${c.docs}/4</span></h2>${ITEM_KEYS.slice(9).map((k, i) => itemHTML(k, i + 9)).join("")}</section>
  <section><h2>${esc(t.cT)}<span class="cnt" data-c="places">${c.places || ""}</span></h2><p class="sub">${esc(t.cS)}</p>${S.places.map(placeHTML).join("")}
    <div class="acts"><button type="button" class="btn ghost" id="addPlace">${esc(t.addPlace)}</button></div></section>
  <section><h2>${esc(t.dT)}<span class="cnt" data-c="people">${c.people || ""}</span></h2><p class="sub">${esc(t.dS)}</p>${S.people.map(personHTML).join("")}
    <div class="acts"><button type="button" class="btn ghost" id="addPerson">${esc(t.addPerson)}</button></div></section>
  <section><h2>${esc(t.eT)}</h2><p class="sub">${esc(t.eS)}</p><div id="letters">${lettersHTML()}</div></section>
  <div class="acts" style="margin-top:24px"><button type="button" class="btn" id="finish">${esc(t.finish)}</button></div>`;
  bindSig();
}
function addFiles(list) {
  for (const f of list) S.files.push({ name: f.name || "photo.jpg", size: f.size || 0, item: target });
  // preview: nothing leaves the device. Connected version: signed upload URL per file (function onboarding-drop), resumable.
  if (target && S.items[target] && !S.items[target].a) S.items[target].a = "share";
  target = null; render();
}
function bindSig() {
  const c = $("#sig"); if (!c) return;
  const ok = $("#sigOk"), r = devicePixelRatio || 1; c.width = c.clientWidth * r; c.height = c.clientHeight * r;
  const g = c.getContext("2d"); g.scale(r, r); g.lineWidth = 2.2; g.lineCap = "round"; g.strokeStyle = "#16241A";
  let down = false, ink = 0;
  const pos = e => { const b = c.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
  c.onpointerdown = e => { down = true; c.setPointerCapture(e.pointerId); g.beginPath(); g.moveTo(...pos(e)); };
  c.onpointermove = e => { if (!down) return; g.lineTo(...pos(e)); g.stroke(); if (++ink > 12) ok.disabled = false; };
  c.onpointerup = c.onpointercancel = () => { down = false; };
  $("#sigClear").onclick = () => { g.clearRect(0, 0, c.width, c.height); ink = 0; ok.disabled = true; };
  ok.onclick = () => { S.signedAt = new Date().toISOString(); S.signedFor = letters().map(p => p.id); render(); };
}
function wire() {
  document.querySelectorAll(".lang button").forEach(b => b.onclick = () => { lang = b.dataset.lang; render(); });
  $("#pick").onchange = e => { addFiles(e.target.files); e.target.value = ""; };
  $("#cam").onchange = e => { addFiles(e.target.files); e.target.value = ""; };
  const m = $("#main");
  m.addEventListener("click", e => {
    const p = e.target.closest(".pill[data-item]"); if (p) {
      const k = p.dataset.item, a = p.dataset.a, it = S.items[k] = S.items[k] || {};
      if (a === "share") { it.a = "share"; target = k; $("#pick").click(); render(); return; }
      it.a = it.a === a ? undefined : a; if (it.a !== "ask") delete it.who; render(); return; }
    if (e.target.closest("#drop") || e.target.closest("#pickBtn")) { e.preventDefault(); target = null; $("#pick").click(); return; }
    if (e.target.closest("#camBtn")) { target = null; $("#cam").click(); return; }
    if (e.target.closest("#addPlace")) { S.places.push({ name: "", kind: 0, address: "", contact: "" }); render(); return; }
    if (e.target.closest("#addPerson")) { S.people.push({ id: "p" + Date.now().toString(36), role: 0, name: "", company: "", email: "", phone: "", direct: true }); render(); return; }
    const rp = e.target.closest("[data-rmplace]"); if (rp) { S.places.splice(+rp.dataset.rmplace, 1); render(); return; }
    const rq = e.target.closest("[data-rmperson]"); if (rq) { const gone = S.people.splice(+rq.dataset.rmperson, 1)[0];
      Object.values(S.items).forEach(it => { if (it.who === gone.id) delete it.who; }); render(); return; }
    if (e.target.closest("#finish")) { S.finished = true; render(); window.scrollTo({ top: 0, behavior: "smooth" }); }
  });
  m.addEventListener("input", e => { const el = e.target;
    if (el.dataset.place != null) S.places[+el.dataset.place][el.dataset.k] = el.value;
    else if (el.dataset.person != null) { const p = S.people[+el.dataset.person]; p[el.dataset.k] = el.type === "checkbox" ? el.checked : el.value; }
    if (el.dataset.place != null || el.dataset.person != null) { clearTimeout(wire.t); wire.t = setTimeout(partial, 400); }
    if (el.dataset.askfor) S.items[el.dataset.askfor].who = el.value; });
  m.addEventListener("change", e => { const el = e.target; if (el.dataset.askfor) S.items[el.dataset.askfor].who = el.value;
    if (el.dataset.place != null && el.tagName === "SELECT") S.places[+el.dataset.place].kind = +el.value;
    if (el.dataset.person != null && el.tagName === "SELECT") S.people[+el.dataset.person].role = +el.value;
    if (el.dataset.person != null && el.type === "checkbox") partial(); });
  m.addEventListener("dragover", e => { const d = e.target.closest("#drop"); if (d) { e.preventDefault(); d.classList.add("over"); } });
  m.addEventListener("dragleave", e => { const d = e.target.closest("#drop"); if (d) d.classList.remove("over"); });
  m.addEventListener("drop", e => { const d = e.target.closest("#drop"); if (!d) return; e.preventDefault(); target = null; addFiles(e.dataTransfer.files); });
}
function start() {
  wire(); $("#loading").classList.add("hidden");
  if (!PREVIEW) { $("#closed").classList.remove("hidden"); render(); return; }   // connected version comes next: until then only the preview opens
  $("#previewNote").classList.remove("hidden"); $("#main").classList.remove("hidden"); render();
}
